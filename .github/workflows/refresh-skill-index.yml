name: refresh-skill-index

on:
  schedule:
    - cron: '0 19 * * *' # 03:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-skill-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild index.json
        run: node scripts/build-index.mjs --with-recommended
      - name: Commit changes
        run: |
          git config user.name "dsh-skill-index[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add index.json
          if git diff --quiet --cached; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh skill index $(date -u +%Y-%m-%d)"
          git push
